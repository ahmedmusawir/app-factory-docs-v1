<text x="32" y="2290" font-family="sans-serif" font-size="17" fill="#0f172a">Review checkpoint 1: after FFM build and its independent QA finish.</text>
<text x="32" y="2319" font-family="sans-serif" font-size="17" fill="#0f172a">Review checkpoint 2: Engine 2 independent system review after all Engine 1 phases/modules and their QA are closed.</text>
<text x="32" y="2348" font-family="sans-serif" font-size="17" fill="#0f172a">At either checkpoint, disposition findings; RRM only for approved findings requiring repairs. A clean review requires no RRM.</text>
<text x="32" y="2377" font-family="sans-serif" font-size="17" fill="#0f172a">Review, Gate Q, required cleanup and certification, Gate D and Director release remain separate responsibilities.</text>
